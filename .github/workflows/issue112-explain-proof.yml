name: Issue 112 typed explain proof

on:
  push:
    branches:
      - feat/112-memory-traceability
    paths:
      - ".github/workflows/issue112-explain-proof.yml"

permissions:
  contents: write

jobs:
  patch-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/112-memory-traceability
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: "pyproject.toml"
      - name: Apply typed explain and docs slice
        run: python .github/issue112_explain_patch.py
      - name: Python SDK suite
        run: uv run --package fraise-sdk pytest sdk/python/src/tests -q
      - name: Full Go suite
        run: go test ./...
      - name: Docker-backed end-to-end suite
        run: make test-e2e
      - name: Commit tested implementation
        run: |
          git config user.name "Nickgonzales76017"
          git config user.email "45552585+Nickgonzales76017@users.noreply.github.com"
          git add sdk/python/src tests/e2e docs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat: expose typed memory explanations"
          git push origin HEAD:feat/112-memory-traceability
