name: Issue 112 provenance proof

on:
  push:
    branches:
      - feat/112-memory-traceability
    paths:
      - ".github/workflows/issue112-provenance-proof.yml"

permissions:
  contents: write

jobs:
  patch-test-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/112-memory-traceability
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: "pyproject.toml"
      - name: Apply provenance vertical slice
        run: python .github/issue112_provenance_patch.py
      - name: Format Go
        run: gofmt -w internal/query/lexer/token.go internal/query/parser/parser.go internal/query/parser/ast.go internal/query/parser/source.go internal/query/parser/source_test.go internal/query/query.go internal/query/remember.go internal/query/stream.go internal/query/provenance_test.go internal/graph/node.go
      - name: Focused Go provenance tests
        run: go test ./internal/query/... ./internal/graph/...
      - name: Full Go suite
        run: go test ./...
      - name: Python provenance tests
        run: uv run --package fraise-sdk pytest sdk/python/src/tests/provenance_test.py -q
      - name: Python SDK suite
        run: uv run --package fraise-sdk pytest sdk/python/src/tests -q
      - name: Commit tested implementation
        run: |
          git config user.name "Nickgonzales76017"
          git config user.email "45552585+Nickgonzales76017@users.noreply.github.com"
          git add internal sdk/python/src
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat: add end-to-end memory provenance"
          git push origin HEAD:feat/112-memory-traceability
